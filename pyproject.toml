# [TR] Standart Python Paket Yapılandırması (Sıfır Dış Bağımlılık)
# [EN] Standard Python Package Configuration (Zero External Dependencies)
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-corpus-manager"
version = "1.1.0"
description = "Zero-dependency automatic classification, corpus auditing, and smart deduplication tool for Zotero libraries (EN/TR)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Zotero Derlem Yöneticisi / Zotero Corpus Manager Contributors"}
]
keywords = ["zotero", "corpus", "linguistics", "kurdish", "zazaki", "kirmancki", "kurmanji", "sorani", "deduplication", "bibliography"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Turkish",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
zotero-derlem = "zotero_cli:main"

[tool.setuptools.packages.find]
include = ["zotero_manager*"]
